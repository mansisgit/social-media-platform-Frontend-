<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Data View | Dekho Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: white; font-family: 'Outfit', sans-serif; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: #6366f1; margin-bottom: 20px; }
        .data-box { background: #000; padding: 20px; border-radius: 12px; font-family: monospace; overflow-x: auto; color: #10b981; }
        .back-link { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${owner} + 's Service Result'">Service Result</h1>
        <p>This data was fetched from the backend (port 8080) using <strong>Spring 6 RestClient</strong>.</p>
        <br>
        <div class="data-box">
            <pre th:text="${#objects.nullSafe(profile, messages != null ? messages : (friends != null ? friends : (groups != null ? groups : (resultData != null ? resultData : 'Data Output'))))}">Data Output</pre>
        </div>
        <a href="/team/dashboard" class="back-link">← Back to Dashboard</a>
    </div>
</body>
</html>
